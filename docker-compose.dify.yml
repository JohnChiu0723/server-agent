# ═══════════════════════════════════════════════════
# GRAVITY 自架 Dify v1.14.2 — Docker Compose
# 啟動：docker compose --env-file .env.dify -f docker-compose.dify.yml -p dify-selfhost up -d
# 停止：docker compose -f docker-compose.dify.yml -p dify-selfhost down
# 面板：http://localhost
# ═══════════════════════════════════════════════════

services:

  # ── PostgreSQL + pgvector ──
  db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-difyai-grv-2024}
      POSTGRES_DB: ${DB_DATABASE:-dify}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./dify-data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - dify-net

  # ── Redis ──
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-difyai-grv-2024}
    volumes:
      - ./dify-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-difyai-grv-2024}", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - dify-net

  # ── Weaviate 向量資料庫 ──
  weaviate:
    image: semitechnologies/weaviate:1.24.10
    restart: always
    environment:
      AUTHENTICATION_APIKEY_ENABLED: true
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:?set WEAVIATE_API_KEY in .env.dify}
      AUTHENTICATION_APIKEY_USERS: grv@gravity.local
      QUERY_DEFAULTS_LIMIT: 25
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
    volumes:
      - ./dify-data/weaviate:/var/lib/weaviate
    networks:
      - dify-net

  # ── Ollama 本地 Embedding / LLM ──
  ollama:
    image: ollama/ollama:0.5.7
    restart: always
    volumes:
      - ./dify-data/ollama:/root/.ollama
    networks:
      - dify-net
    deploy:
      resources:
        limits:
          memory: 4G

  # ── Dify Plugin Daemon（v1.14.2 必備）──
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.3-local
    restart: always
    environment:
      PLUGIN_DAEMON_PORT: 5003
      PLUGIN_REMOTE_INSTALLING_HOST: localhost
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      SERVER_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-grv-plugin-inner-key-2024}
      DIFY_SERVER_URL: http://api:5001
      DIFY_INNER_API_URL: http://api:5001
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-grv-plugin-inner-key-2024}
      # DB config
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-difyai-grv-2024}
      DB_DATABASE: dify
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dify-net

  # ── Dify API ──
  api:
    image: langgenius/dify-api:1.14.2
    restart: always
    env_file: .env.dify
    environment:
      MODE: api
      DIFY_BIND_ADDRESS: 0.0.0.0
      DIFY_PORT: 5001
      GUNICORN_TIMEOUT: 360
      SERVER_WORKER_AMOUNT: 1
      SERVER_WORKER_CLASS: gevent
      SSRF_PROXY_HTTP_URL:
      SSRF_PROXY_HTTPS_URL:
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:-grv-plugin-inner-key-2024}
      PLUGIN_DAEMON_URL: http://plugin_daemon:5003
      PLUGIN_DAEMON_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-grv-plugin-inner-key-2024}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./dify-data/storage:/app/api/storage
    networks:
      - dify-net

  # ── Celery Worker ──
  worker:
    image: langgenius/dify-api:1.14.2
    restart: always
    env_file: .env.dify
    environment:
      MODE: worker
      SSRF_PROXY_HTTP_URL:
      SSRF_PROXY_HTTPS_URL:
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:-grv-plugin-inner-key-2024}
      PLUGIN_DAEMON_URL: http://plugin_daemon:5003
      PLUGIN_DAEMON_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-grv-plugin-inner-key-2024}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./dify-data/storage:/app/api/storage
    networks:
      - dify-net

  # ── Dify Web UI ──
  web:
    image: langgenius/dify-web:1.14.2
    restart: always
    environment:
      CONSOLE_API_URL: ${CONSOLE_API_URL:-http://localhost}
      APP_API_URL: ${APP_API_URL:-http://localhost}
    networks:
      - dify-net

  # ── Nginx 反向代理（單一入口 http://localhost）──
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./dify-data/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - dify-net

networks:
  dify-net:
    driver: bridge
